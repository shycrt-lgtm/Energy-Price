<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에너지 단가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* KPX-Daily-Report · TMS 와 동일한 톤: 흰 배경 · Noto Sans KR · 네이비(#001f3f) 헤더 · 얇은 회색 격자 표 */
:root{--line:#e5e7eb;--mute:#64748b;--up:#dc2626;--down:#059669}
*{box-sizing:border-box}
html{overflow-y:scroll}
body{margin:0;font-family:'Noto Sans KR',sans-serif;background:#fff;color:#1a1a1a;line-height:1.5;font-size:16px}
a{color:inherit;text-decoration:none}
.site-header{line-height:1.4;position:sticky;top:0;z-index:100;background:#001f3f;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header .in{max-width:1000px;margin:0 auto;padding:18px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.site-header h1{line-height:1.2;margin:0;font-size:28px;font-weight:900;letter-spacing:-.02em;color:#fff}
.site-header .sub{margin:4px 0 0;font-size:13px;color:#b6c2d1}
.site-header .sub b{color:#fff;font-weight:700}
.menu{display:flex;gap:10px;flex-wrap:wrap}
.menu a,.menu span.off{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:190px;height:44px;padding:0;border-radius:2px;background:#e5e7eb;color:#1e293b;font-size:14px;font-weight:700;transition:background .15s}
.menu a:hover{background:#f1f5f9}
.menu span.off{opacity:.55}
.menu a span{font-size:16px;line-height:1}
@media (max-width:640px){.site-header h1{font-size:22px}.menu{width:100%}.menu a,.menu span.off{flex:1;width:auto;height:40px;padding:0 12px;font-size:13px}}
.wrap{max-width:1000px;margin:0 auto;padding:28px 16px 48px}
body h2{display:flex;align-items:center;font-size:18px;font-weight:700;color:#001f3f;margin:30px 0 10px;padding-bottom:8px;border-bottom:2px solid #e5e7eb}
body h2::before{content:'';flex:none;width:6px;height:18px;margin-right:9px;background:#001f3f}
.card{margin:0}
.pick-row{display:flex;justify-content:flex-start;align-items:center;gap:8px 16px;flex-wrap:wrap;margin:0 0 4px}
.pick{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:6px 12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pick .lb{font-size:14px;font-weight:700;color:#334155}
.pick .hint{font-size:12px;color:#64748b}
.seg{display:inline-flex;border:1px solid #e2e8f0;border-radius:4px;overflow:hidden}
.seg button{border:0;background:#fff;color:#334155;padding:6px 14px;cursor:pointer;font:inherit;font-size:12px;font-weight:700}
.seg button.on{background:#001f3f;color:#fff}
select{padding:5px 10px;border:1px solid #e2e8f0;border-radius:4px;background:#fff;color:#1e293b;font:inherit;font-size:14px;font-weight:700}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;margin:0 0 10px}
.ctl .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table.eq{table-layout:fixed}
table.eq th,table.eq td{white-space:normal;padding:12px 6px;word-break:keep-all}
.legend svg{display:inline-block;vertical-align:middle;margin-right:5px}
.legend span{display:inline-flex;align-items:center}
.hint2{font-size:12px;color:#64748b;white-space:nowrap}
.sub2{font-size:13px;color:#64748b}
.cbox{background:#f9fafb;border:1px solid #e5e7eb;padding:16px 20px;font-size:15px;line-height:1.75;color:#1a1a1a}
.cbox ul{margin:0;padding-left:20px;color:#334155}
.cbox li{margin:2px 0}
.up{color:var(--up);font-weight:700}.down{color:var(--down);font-weight:700}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 4px}
.tabs a{display:inline-flex;align-items:center;justify-content:center;min-width:150px;height:40px;padding:0 16px;border-radius:2px;background:#e5e7eb;color:#1e293b;font-size:14px;font-weight:700}
.tabs a:hover{background:#f1f5f9}
.tabs a.on{background:#001f3f;color:#fff}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{border:1px solid #e5e7eb;padding:12px;text-align:center;font-size:.875rem;white-space:nowrap}
th{background:#f8fafc;font-weight:700;color:#334155;line-height:1.4}
td.l{text-align:left}
td:first-child{font-weight:700}
table.gt{table-layout:fixed}
table.gt th,table.gt td{white-space:normal;word-break:keep-all}
table.gt td{font-weight:400}
table.fx{table-layout:fixed}
table.fx th,table.fx td{white-space:normal}
table.gt td.u1{font-weight:700;background:#f8fafc;color:#001f3f}
table.gt td.u2{font-weight:500;background:#fcfdfe}
table.gt td.u3{font-weight:400}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 8px;font-size:12px;color:#334155;font-weight:500}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px}
#chart{position:relative;border:1px solid #e5e7eb;padding:1rem;background:#fff}
#svg{font-family:inherit;display:block}
#tip{position:absolute;pointer-events:none;background:#fff;border:1px solid #cbd5e1;padding:8px 10px;font-size:12px;box-shadow:0 10px 25px -5px rgba(0,0,0,.15);display:none;z-index:5;white-space:nowrap}
tr.cur td{font-weight:900;color:#001f3f;background:#eef4fb;border-top:2px solid #001f3f;border-bottom:2px solid #001f3f}
tr.cur td.up{color:var(--up)}
tr.cur td.down{color:var(--down)}
tr.cur td:first-child{border-left:2px solid #001f3f}
tr.cur td:last-child{border-right:2px solid #001f3f}
.totop{text-align:center;margin:28px 0 0}
.totop button{background:#001f3f;color:#fff;border:0;border-radius:4px;padding:10px 22px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.totop button:hover{background:#1e293b}
.btnlatest{background:#001f3f;color:#fff;border:0;border-radius:4px;padding:7px 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2);margin-left:4px}
.btnlatest:hover{background:#1e293b}
#cs{position:relative;overflow-x:auto}
table.eq{min-width:760px}
table.gt{min-width:820px}
table.fx{min-width:560px}
.note{color:#64748b;font-size:12px;margin-top:8px}
footer{color:#64748b;font-size:12px;margin-top:28px}
</style>

</head>
<body>
<header class="site-header">
  <div class="in">
    <div>
      <h1><a href="#home" style="color:#fff">에너지 단가</a></h1>
      <p class="sub" id="sub"></p>
    </div>
    <nav class="menu" id="sites"></nav>
  </div>
</header>
<div class="wrap">
<div id="view"></div>
<footer id="ft">도시가스: 삼천리 단가변동표(VAT 별도) · KOGAS: 발전용 천연가스 요금 단가(일반발전사업자, 원/GJ 고시) · 열요금: 한국지역난방공사(VAT 별도). 도시가스·KOGAS는 선택 단위로 통일 표시, 열요금은 원/Mcal.</footer>
</div>
<script src="site.config.js"></script>
<script src="data/rates.js"></script>
<script src="data/kogas.js"></script>
<script src="data/heat.js"></script>
<script>
(function(){
var C=window.SITE_CONFIG, R=window.RATES||{regions:{},months:[]}, K=window.KOGAS||{months:{}}, H=window.HEAT||{history:[]};
var KCAL=C.heatingValueKcal||10190, CF=KCAL*4.1868/1000, EFF=0.9;
// 우축(원/Mcal)은 좌축과 같은 눈금: 도시가스를 개별난방(효율 90%)으로 환산한 원/Mcal. 열요금 선이 도시가스 선보다 위면 열요금이 더 비쌈
function heatToPrim(h){return h*EFF*KCAL/1000/(state.unit==="m3"?1:CF)}
function primToHeat(p){return p/(EFF*KCAL/1000)*(state.unit==="m3"?1:CF)}
var state={unit:"m3", region:"경기"};
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

$("#sites").innerHTML=C.sites.filter(function(x){return x.id!==C.current}).map(function(x){
  return x.url?'<a href="'+esc(x.url)+'">'+esc(x.name)+' <span>›</span></a>':'<span class="off" title="주소 미설정">'+esc(x.name)+'</span>';
}).join("");

function unitLabel(){return state.unit==="m3"?"원/㎥":"원/MJ"}
function conv(mj){return mj==null?null:(state.unit==="m3"?mj*CF:mj)}
function fmt(v,d){return v==null?"-":v.toLocaleString("ko-KR",{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d})}
function fmtDP(d,base,br){if(d==null||!base)return fmtD(d);var q=d/base*100;return fmtD(d)+(br?"<br>":" ")+"("+(q>1e-9?"+":q<-1e-9?"-":"")+fmt(Math.abs(q))+"%)"}
function pctS(d,base){if(d==null||!base)return "";var q=d/base*100;return (q>1e-9?"+":q<-1e-9?"-":"")+fmt(Math.abs(q))+"%"}
function fmtD(v){if(v==null)return "-";var s=fmt(Math.abs(v));return (v>1e-9?"+":v<-1e-9?"-":"")+s}


function ym(iso){return iso.slice(0,7)}
function addM(m,n){var y=+m.slice(0,4),mo=+m.slice(5,7)-1+n;y+=Math.floor(mo/12);mo=((mo%12)+12)%12;return y+"-"+String(mo+1).padStart(2,"0")}
function gasMonths(region){var r=R.regions[region];return r?Object.keys(r.months).map(ym):[]}
function gasMJ(region,key,m){var r=R.regions[region];if(!r)return null;var d=r.months[m+"-01"];return d&&d[key]!=null?d[key]:null}
function kogasMJ(m){var d=K.months&&K.months[m];return d?d.total/1000:null}
function heatAt(m,cls){var h=null;(H.history||[]).forEach(function(x){if(x.from.slice(0,7)<=m)h=x});return h?h[cls]:null}
var KEYS={"주택난방":{"경기":"주택난방","인천":"주택난방"},"산업용":{"경기":"산업용","인천":"산업용"},
 "열병합용":{"경기":"지역열병합집단에너지사업허가","인천":"지역열병합(CHP)"},"연료전지용":{"경기":"연료전지용","인천":"연료전지용"}};
var latest=(function(){var a=gasMonths("경기").concat(gasMonths("인천"),Object.keys(K.months||{}));return a.sort().pop()})();

function route(){return (location.hash||"#home").slice(1)}
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0)});

function render(){
  $("#sub").innerHTML="기준월: <b>"+(latest?latest.slice(0,4)+"년 "+(+latest.slice(5))+"월":"-")+"</b> | 에너지사업총괄";
  var r=route();
  $("#ft").style.display=(r==="gas"||r==="kogas"||r==="heat")?"none":"";
  if(r==="gas")viewGas();else if(r==="kogas")viewKogas();else if(r==="heat")viewHeat();else viewHome();
}
function tabs(cur){
  return '<div class="tabs">'+[["home","에너지단가 HOME"],["gas","도시가스"],["kogas","KOGAS 발전용(일반발전)"],["heat","열요금"]].filter(function(t){return !(cur==="none"&&t[0]==="home")}).map(function(t){
    return '<a href="#'+t[0]+'" class="'+(cur===t[0]?"on":"")+'">'+t[1]+'</a>'}).join("")+'</div>';
}
function regSeg(){return '<div class="seg" id="regSeg">'+["경기","인천"].map(function(g){return '<button data-r="'+g+'" class="'+(state.region===g?"on":"")+'">'+g+'</button>'}).join("")+'</div>'}
function unitPick(){return '<div class="pick"><span class="lb">단위</span><div class="seg" id="unitSeg">'+[["m3","원/㎥"],["mj","원/MJ"]].map(function(u){return '<button data-u="'+u[0]+'" class="'+(state.unit===u[0]?"on":"")+'">'+u[1]+'</button>'}).join("")+'</div></div><span class="hint2" style="visibility:'+(state.unit==="m3"?"visible":"hidden")+'">'+KCAL.toLocaleString("ko-KR")+'kcal/㎥ 기준</span>'}
function regPick(){return '<div class="pick"><span class="lb">도시가스 지역</span>'+regSeg()+'</div>'}
function bindUnit(fn){var el=$("#unitSeg");if(el)el.onclick=function(e){var u=e.target.getAttribute&&e.target.getAttribute("data-u");if(u){state.unit=u;fn()}}}
function bindReg(fn){var rs=$("#regSeg");if(rs)rs.onclick=function(e){var g=e.target.getAttribute&&e.target.getAttribute("data-r");if(g){state.region=g;fn()}}}

var SERIES=[
 {name:"도시가스 주택난방용",g:"도시가스",sub:"주택난방용",color:"#1f5fbf",shape:"circle",get:function(m){return conv(gasMJ(state.region,KEYS["주택난방"][state.region],m))}},
 {name:"도시가스 산업용",g:"도시가스",sub:"산업용",color:"#e08a00",shape:"x",get:function(m){return conv(gasMJ(state.region,KEYS["산업용"][state.region],m))}},
 {name:"도시가스 열병합용",g:"도시가스",sub:"열병합용",color:"#2a9d5c",shape:"tri",get:function(m){return conv(gasMJ(state.region,KEYS["열병합용"][state.region],m))}},
 {name:"도시가스 연료전지용",g:"도시가스",sub:"연료전지용",color:"#8e44ad",shape:"diamond",get:function(m){return conv(gasMJ(state.region,KEYS["연료전지용"][state.region],m))}},
 {name:"KOGAS 발전용(일반발전)",g:"KOGAS 발전용",sub:"일반발전",color:"#c0392b",shape:"square",get:function(m){return conv(kogasMJ(m))}},
 {name:"열요금(한난) 주택용 난방(우축)",g:"열요금",sub:"주택용 난방",color:"#555e6b",dash:"5 4",sec:true,get:function(m){return heatAt(m,"residential")}}
];
function sname(s){return s.name.replace("(우축)","")}
function mk(shape,x,y,c,r){
  if(!shape)return "";
  x=+x;y=+y;
  if(shape==="circle")return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'"/>';
  if(shape==="square")return '<rect x="'+(x-r)+'" y="'+(y-r)+'" width="'+2*r+'" height="'+2*r+'" fill="'+c+'"/>';
  if(shape==="tri")return '<polygon points="'+x+','+(y-r-1)+' '+(x-r-1)+','+(y+r)+' '+(x+r+1)+','+(y+r)+'" fill="'+c+'"/>';
  if(shape==="diamond")return '<polygon points="'+x+','+(y-r-1.5)+' '+(x+r+1.5)+','+y+' '+x+','+(y+r+1.5)+' '+(x-r-1.5)+','+y+'" fill="'+c+'"/>';
  return '<path d="M'+(x-r)+' '+(y-r)+'L'+(x+r)+' '+(y+r)+'M'+(x+r)+' '+(y-r)+'L'+(x-r)+' '+(y+r)+'" stroke="'+c+'" stroke-width="2" fill="none"/>';
}
function swatch(s){return '<svg width="28" height="12" viewBox="0 0 28 12"><line x1="0" x2="28" y1="6" y2="6" stroke="'+s.color+'" stroke-width="2"'+(s.dash?' stroke-dasharray="5 4"':'')+'/>'+mk(s.shape,14,6,s.color,3)+'</svg>'}

function viewHome(){
  var months=[];for(var i=23;i>=0;i--)months.push(addM(latest,-i));
  var html='';
  html+='<div class="card"><h2>요금 변동 사항 ('+latest+')</h2><div class="cbox"><ul id="cm"></ul></div></div>';
  html+='<div class="card"><h2>최근 24개월 요금 추이 ('+months[0]+' ~ '+latest+', 도시가스 '+state.region+')</h2><div class="ctl"><div class="r">'+regPick()+unitPick()+'</div></div><div class="legend">'+SERIES.map(function(s){return '<span>'+swatch(s)+s.name+'</span>'}).join("")+'</div><div id="chart"><div id="cs"><svg id="svg"></svg><div id="tip"></div></div></div><div class="note">열요금 선이 도시가스 주택난방용 선보다 위에 있으면 열요금이 더 비싼 구간입니다.(개별난방 보일러 효율 90%, 열량 '+KCAL.toLocaleString("ko-KR")+'kcal/㎥ 기준)</div></div>';
  html+='<div class="card"><h2>요금표 (최근 12개월, '+unitLabel()+', 열요금 원/Mcal)</h2><div class="tw"><table id="tbl" class="eq"></table></div><div class="note">빈 칸(-)은 해당 월 데이터가 아직 수집되지 않은 구간입니다. 열병합용 = '+esc(KEYS["열병합용"][state.region])+'. 굵은 테두리 행은 당월('+latest+')입니다. 열요금은 기준사업자(한국지역난방공사, 한난) 요금입니다.</div></div>';
  html+='<div><h2>요금상세</h2>'+tabs("none")+'</div>'+'<div class="totop"><button type="button" id="toTop">▲ 맨 위로</button></div>';
  $("#view").innerHTML=html;
  bindReg(render);bindUnit(render);$("#toTop").onclick=function(){window.scrollTo({top:0,behavior:"smooth"})};
  comments();chart(months);table(months.slice(-12));
}
function comments(){
  var prev=addM(latest,-1), out=[];
  ["경기","인천"].forEach(function(g){
    var r=R.regions[g]; if(!r)return;
    var cur=r.months[latest+"-01"], pre=r.months[prev+"-01"];
    if(!cur||!pre){out.push("도시가스 "+g+": "+latest+" 또는 "+prev+" 자료 없음");return}
    var ch=[],n=0;
    Object.keys(KEYS).forEach(function(lab){
      var k=KEYS[lab][g]; if(cur[k]==null||pre[k]==null)return;
      if(Math.abs(cur[k]-pre[k])<1e-9){ch.push(lab+" "+fmt(conv(cur[k]))+"(0.00)");return}
      ch.push(lab+" "+fmt(conv(pre[k]))+"→"+fmt(conv(cur[k]))+"("+fmtD(conv(cur[k])-conv(pre[k]))+", "+pctS(conv(cur[k])-conv(pre[k]),conv(pre[k]))+")");
    });
    Object.keys(cur).forEach(function(k){if(pre[k]!=null&&Math.abs(cur[k]-pre[k])>1e-9)n++});
    out.push("도시가스 "+g+": 전월 대비 "+n+"개 용도 요금 변동"+(ch.length?". "+ch.join(", ")+" ("+unitLabel()+")":""));
  });
  var kc=kogasMJ(latest),kp=kogasMJ(prev);
  if(kc!=null&&kp!=null)out.push("KOGAS 발전용(일반발전): "+fmt(conv(kp))+"→"+fmt(conv(kc))+" "+unitLabel()+" ("+fmtD(conv(kc)-conv(kp))+", "+fmtD((kc/kp-1)*100)+"%)");
  var hc=heatAt(latest,"residential"),hp=heatAt(prev,"residential");
  if(hc!=null)out.push(hc===hp?"열요금(기준사업자) 주택용 난방 단일요금: "+fmt(hc)+" 원/Mcal, 전월과 동일":"열요금(기준사업자) 주택용 난방 단일요금: "+fmt(hp)+"→"+fmt(hc)+" 원/Mcal ("+fmtD(hc-hp)+", "+pctS(hc-hp,hp)+")");
  $("#cm").innerHTML=out.map(function(s){return "<li>"+esc(s)+"</li>"}).join("");
}
function table(months){
  var h='<tr><th rowspan="2">월</th><th colspan="4">도시가스</th><th>KOGAS 발전용</th><th>열요금<br><small style="font-weight:400;color:#64748b">(기준사업자)</small></th></tr><tr>'+SERIES.map(function(s){return '<th>'+s.sub+'</th>'}).join("")+'</tr>';
  months.slice().reverse().forEach(function(m,ix){
    h+='<tr'+(ix===0?' class="cur"':'')+'><td>'+m+'</td>'+SERIES.map(function(s){return '<td>'+fmt(s.get(m))+'</td>'}).join("")+'</tr>';
  });
  $("#tbl").innerHTML=h;
}
function chart(months){
  var W=Math.max(760,$("#cs").clientWidth||900),Ht=360,m={l:62,r:62,t:18,b:34};
  var svg=$("#svg");svg.setAttribute("width",W);svg.setAttribute("height",Ht);
  var pw=W-m.l-m.r,ph=Ht-m.t-m.b;
  function range(){var a=[];SERIES.forEach(function(s){months.forEach(function(x){var v=s.get(x);if(v!=null)a.push(s.sec?heatToPrim(v):v)})});
    if(!a.length)return [0,1];var lo=Math.min.apply(0,a),hi=Math.max.apply(0,a);var pad=(hi-lo)*0.12||hi*0.1||1;return [Math.max(0,lo-pad),hi+pad]}
  var rp=range();
  var gp=18;function X(i){return m.l+gp+(pw-2*gp)*i/(months.length-1)}
  function Y(v,r){return m.t+ph*(1-(v-r[0])/(r[1]-r[0]))}
  var o="",i;
  for(i=0;i<=5;i++){var vp=rp[0]+(rp[1]-rp[0])*i/5,vs=primToHeat(vp),y=m.t+ph*(1-i/5);
    o+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/>';
    o+='<text x="'+(m.l-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--mute)">'+fmt(vp,state.unit==="m3"?1:2)+'</text>';
    o+='<text x="'+(W-m.r+6)+'" y="'+(y+4)+'" font-size="11" fill="var(--mute)">'+fmt(vs,1)+'</text>';}
  o+='<text x="'+m.l+'" y="10" font-size="11" fill="var(--mute)">좌: '+unitLabel()+'</text><text x="'+(W-m.r)+'" y="10" font-size="11" text-anchor="end" fill="var(--mute)">우: 원/Mcal</text>';
  months.forEach(function(x,i){if(i%3===(months.length-1)%3)o+='<text x="'+X(i)+'" y="'+(Ht-12)+'" text-anchor="middle" font-size="11" fill="var(--mute)">'+x+'</text>'});
  SERIES.forEach(function(s){
    var r=rp,d="",pen=false;
    months.forEach(function(x,i){var v=s.get(x);if(v==null){pen=false;return}if(s.sec)v=heatToPrim(v);d+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(v,r).toFixed(1)+" ";pen=true});
    o+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2"'+(s.dash?' stroke-dasharray="'+s.dash+'"':'')+'/>';
    months.forEach(function(x,i){var v=s.get(x);if(v!=null)o+=mk(s.shape,X(i).toFixed(1),Y(s.sec?heatToPrim(v):v,r).toFixed(1),s.color,3)});
  });
  o+='<line id="vl" y1="'+m.t+'" y2="'+(m.t+ph)+'" stroke="var(--mute)" stroke-dasharray="3 3" style="display:none"/><rect id="hit" x="'+m.l+'" y="'+m.t+'" width="'+pw+'" height="'+ph+'" fill="transparent"/>';
  svg.innerHTML=o;
  var tip=$("#tip"),vl=$("#vl");
  function move(e){
    var b=svg.getBoundingClientRect(),cx=e.touches?e.touches[0].clientX:e.clientX,px=cx-b.left;
    var i=Math.round((px-m.l-gp)/(pw-2*gp)*(months.length-1));i=Math.max(0,Math.min(months.length-1,i));
    vl.setAttribute("x1",X(i));vl.setAttribute("x2",X(i));vl.style.display="";
    tip.innerHTML='<b>'+months[i]+'</b>'+SERIES.map(function(s){var v=s.get(months[i]);
      return '<div style="display:flex;align-items:center">'+swatch(s)+sname(s)+': <b>'+fmt(v)+'</b> '+(s.sec?"원/Mcal":unitLabel())+'</div>'}).join("");
    tip.style.display="block";
    var tx=X(i)+14;if(tx+tip.offsetWidth>W)tx=X(i)-tip.offsetWidth-14;
    tip.style.left=Math.max(0,tx)+"px";tip.style.top="20px";
  }
  var hit=$("#hit");hit.onmousemove=move;hit.ontouchmove=move;hit.onmouseleave=function(){tip.style.display="none";vl.style.display="none"};
}
window.addEventListener("resize",function(){if(route()==="home")render()});

function monthSelect(list,sel,suffix){
  return '<select id="msel">'+list.slice().reverse().map(function(m){return '<option value="'+m+'"'+(m===sel?" selected":"")+'>'+m+(suffix||"")+'</option>'}).join("")+'</select>';
}
function prevOf(list,m){var i=list.indexOf(m);return i>0?list[i-1]:null}
function cls(d){return d>1e-9?"up":d<-1e-9?"down":""}

var gasSel=null;
function viewGas(){
  var list=gasMonths(state.region).sort();
  if(!gasSel||list.indexOf(gasSel)<0)gasSel=list[list.length-1];
  var r=R.regions[state.region],cur=r.months[gasSel+"-01"],pm=prevOf(list,gasSel),pre=pm?r.months[pm+"-01"]:null;
  var h=tabs("gas")+'<div class="card"><h2>도시가스 요금 상세</h2><div class="ctl"><div class="pick"><span class="lb">조회월</span>'+monthSelect(list,gasSel)+'<button type="button" class="btnlatest" id="btnLatest">가장 최근 요금('+list[list.length-1]+')으로 →</button></div><div class="r">'+regPick()+unitPick()+'</div></div><div class="tw"><table class="gt"><colgroup><col style="width:14%"><col style="width:19%"><col style="width:11%"><col style="width:10%"><col style="width:10%"><col style="width:14%"><col style="width:22%"></colgroup><tr><th colspan="3">용도 구분</th><th>요금</th><th>전월</th><th>증감</th><th>비고</th></tr>';
  var keys=r.order.filter(function(k){return cur[k]!=null});
  var P=keys.map(function(k){var q=k.split(" > "),o={k:k,a:q[0]};
    if(q.length===2){var m=q[1].match(/^(직영충전소(?:\([^)]*\))?)\s+(최대부하|중간부하|경부하)$/);if(m){o.b=m[1];o.c=m[2]}else o.b=q[1]}
    else if(q.length>=3){o.b=q[1];o.c=q[2]}
    return o});
  P.forEach(function(o,i){var n=P[i+1];if(o.b!==undefined&&o.c===undefined&&n&&n.a===o.a&&n.b===o.b&&n.c!==undefined)o.c=""});
  function run(i,f){var n=1;while(P[i+n]&&f(P[i+n])===f(P[i]))n++;return n}
  P.forEach(function(o,i){
    var k=o.k,v=conv(cur[k]),pv=pre&&pre[k]!=null?conv(pre[k]):null,d=pv==null?null:v-pv,pr=P[i-1],u="";
    if(o.b===undefined){u='<td class="u1" colspan="3">'+esc(o.a)+'</td>'}
    else{
      if(!pr||pr.a!==o.a)u+='<td class="u1" rowspan="'+run(i,function(x){return x.a})+'">'+esc(o.a)+'</td>';
      if(!pr||pr.a!==o.a||pr.b!==o.b)u+='<td class="u2" rowspan="'+run(i,function(x){return x.a+"|"+x.b})+'"'+(o.c===undefined?' colspan="2"':'')+'>'+esc(o.b)+'</td>';
      if(o.c!==undefined)u+='<td class="u3">'+esc(o.c)+'</td>';
    }
    h+='<tr>'+u+'<td>'+fmt(v)+'</td><td>'+fmt(pv)+'</td><td class="'+cls(d)+'">'+fmtDP(d,pv)+'</td><td>'+esc(r.remarks[k]||"")+'</td></tr>';
  });
  h+='</table></div><div class="note">'+esc(r.note||"")+'</div></div>'+'<div class="totop"><button type="button" id="toTop">▲ 맨 위로</button></div>';
  $("#view").innerHTML=h;
  $("#msel").onchange=function(e){gasSel=e.target.value;viewGas()};$("#btnLatest").onclick=function(){gasSel=list[list.length-1];viewGas()};
  bindReg(viewGas);bindUnit(viewGas);$("#toTop").onclick=function(){window.scrollTo({top:0,behavior:"smooth"})};
}

var kSel=null;
function viewKogas(){
  var list=Object.keys(K.months).sort();
  if(!kSel||list.indexOf(kSel)<0)kSel=list[list.length-1];
  var d=K.months[kSel],pm=prevOf(list,kSel),p=pm?K.months[pm]:null;
  function row(lab,k,c){var v=conv(d[k]/1000),pv=p?conv(p[k]/1000):null,df=pv==null?null:v-pv;
    return '<tr'+(c?' class="cur"':'')+'><td>'+lab+'</td><td>'+fmt(v)+'</td><td>'+fmt(pv)+'</td><td class="'+cls(df)+'">'+fmtDP(df,pv)+'</td><td>'+fmt(d[k],2)+'</td></tr>'}
  var h=tabs("kogas")+'<div class="card"><h2>KOGAS 발전용 천연가스 요금 (일반발전사업자)</h2><div class="ctl"><div class="pick"><span class="lb">조회월</span>'+monthSelect(list,kSel)+'<button type="button" class="btnlatest" id="btnLatest">가장 최근 요금('+list[list.length-1]+')으로 →</button></div><div class="r">'+unitPick()+'</div></div><div class="tw"><table class="fx"><tr><th>구분</th><th>'+kSel+'</th><th>전월</th><th>증감</th><th>원자료(원/GJ)</th></tr>'
   +row("원료비","fuel")+row("공급비","supply")+row("합계","total",1)+'</table></div><div class="note">'+esc(K.basis||"")+' · '+esc(K.note||"")+'</div></div>';
  $("#view").innerHTML=h;
  $("#msel").onchange=function(e){kSel=e.target.value;viewKogas()};$("#btnLatest").onclick=function(){kSel=list[list.length-1];viewKogas()};bindUnit(viewKogas);
}

var hSel=null;
function viewHeat(){
  var hist=(H.history||[]).slice().sort(function(a,b){return a.from<b.from?-1:1});
  var list=hist.map(function(x){return x.from});
  if(!hSel||list.indexOf(hSel)<0)hSel=list[list.length-1];
  var cur=hist[list.indexOf(hSel)],pi=list.indexOf(hSel),pre=pi>0?hist[pi-1]:null;
  var rows=[["주택용 난방용","residential"],["업무용 난방용","business"],["공공용 난방용","public"]];
  var pm=addM(hSel.slice(0,7),-1), pd=pre?pre.from.slice(2):null;
  var h=tabs("heat")+'<div class="card"><h2>열요금 (기준사업자 한국지역난방공사 · 난방용 단일요금)</h2><div class="ctl"><div class="pick"><span class="lb">변동 시점</span>'+monthSelect(list,hSel)+'<button type="button" class="btnlatest" id="btnLatest">가장 최근 요금('+list[list.length-1]+')으로 →</button></div><div class="r"><span class="sub2">단위 원/Mcal</span></div></div><div class="tw"><table class="fx"><tr><th>구분</th><th>'+hSel+'부터</th><th>'+hSel+' 이전</th><th>증감</th><th>직전 개정시기</th></tr>';
  rows.forEach(function(r){var v=cur[r[1]],p=heatAt(pm,r[1]),d=p==null?null:v-p,pv=pre?pre[r[1]]:null;
    h+='<tr><td>'+r[0]+'</td><td>'+fmt(v)+'</td><td>'+fmt(p)+'</td><td class="'+cls(d)+'">'+fmtDP(d,p,1)+'</td><td>'+(pd||'-')+'</td></tr>'});
  h+='</table></div><div class="note">※ 기본요금 — 주택용: '+esc(cur.base.residential)+' · 업무용: '+esc(cur.base.business)+' · 공공용: '+esc(cur.base.public)+'<br>열요금은 기준사업자인 한국지역난방공사(한난)의 요금입니다.<br>출처: '+esc(H.source||"")+'. 과거 요금 이력은 자료 확보 후 추가 예정입니다.</div></div>';
  $("#view").innerHTML=h;
  $("#msel").onchange=function(e){hSel=e.target.value;viewHeat()};$("#btnLatest").onclick=function(){hSel=list[list.length-1];viewHeat()};
}

render();
})();
</script>
